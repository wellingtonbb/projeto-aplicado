# ==============================================================================
# PROJETO WEB SEGURO — SECURE BY DESIGN / SECURE BY DEFAULT
# Apache 2.4 no HOST: Reverse Proxy + Terminador SSL/TLS + Security Headers
# Arquivo: /etc/apache2/sites-available/secure-web.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. VirtualHost HTTP (Porta 80) — Redirecionamento Permanente para HTTPS
# Requisito 23: HTTP (80) -> Redirecionamento 301 Permanente -> HTTPS (443)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName SEU_DOMINIO_OU_IP
    ServerAdmin webmaster@SEU_DOMINIO_OU_IP

    # Redirecionamento permanente estrito (HTTP 301) para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # Logs do VirtualHost HTTP
    ErrorLog ${APACHE_LOG_DIR}/secure-web-http-error.log
    CustomLog ${APACHE_LOG_DIR}/secure-web-http-access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. VirtualHost HTTPS (Porta 443) — Terminador SSL/TLS + Reverse Proxy
# Requisitos 22, 24, 25, 26: Terminação TLS, Security Headers e Reverse Proxy
# ------------------------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName SEU_DOMINIO_OU_IP
    ServerAdmin webmaster@SEU_DOMINIO_OU_IP

    # --------------------------------------------------------------------------
    # Configuração SSL/TLS (Let's Encrypt / Certbot)
    # Requisitos 24, 28 e 29: Certificados gerenciados exclusivamente no HOST
    # --------------------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/SEU_DOMINIO_OU_IP/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/SEU_DOMINIO_OU_IP/privkey.pem

    # Protocolos e Cifras Modernas (TLS 1.2 e TLS 1.3 apenas)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128
    SSLHonorCipherOrder on

    # --------------------------------------------------------------------------
    # Cabeçalhos de Segurança Estritos (Security Headers)
    # Requisito 22: Content-Security-Policy, HSTS, X-Content-Type-Options, etc.
    # --------------------------------------------------------------------------
    # Strict-Transport-Security (HSTS - 1 ano com subdomínios)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Prevenção contra MIME Sniffing
    Header always set X-Content-Type-Options "nosniff"

    # Prevenção contra Clickjacking
    Header always set X-Frame-Options "DENY"

    # Política de Referência Estrita
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Restrição de permissões de hardware e APIs do navegador
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()"

    # Content-Security-Policy (CSP) compatível com Bootstrap 5 e UI
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self';"

    # Ocultar assinatura e versão do Apache do Host
    Header unset Server
    Header always unset X-Powered-By

    # --------------------------------------------------------------------------
    # Bloqueio de Arquivos Sensíveis no Apache do HOST (Defesa em Profundidade)
    # Requisito 46: Bloqueio estrito de /.env, /.git, etc.
    # --------------------------------------------------------------------------
    <LocationMatch "(^|/)\.(env|git|svn|hg|dockerignore|gitignore)">
        Require all denied
    </LocationMatch>

    # --------------------------------------------------------------------------
    # Configuração de Reverse Proxy para o Contêiner Docker
    # Requisitos 25 e 26: Encaminhamento seguro para 127.0.0.1:8080
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    # Cabeçalhos de Proxy para o Laravel (Reconhecimento de HTTPS e IP real)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Encaminhamento de tráfego reverso
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Logs do VirtualHost HTTPS
    ErrorLog ${APACHE_LOG_DIR}/secure-web-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/secure-web-ssl-access.log combined
</VirtualHost>
</IfModule>
