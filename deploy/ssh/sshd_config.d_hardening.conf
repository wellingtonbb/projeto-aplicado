# ==============================================================================
# PROJETO WEB SEGURO — SECURE BY DESIGN / SECURE BY DEFAULT
# Configuração de Hardening SSH no HOST (Ubuntu 24.04 LTS)
# Arquivo: /etc/ssh/sshd_config.d/99-secure-hardening.conf
# Requisito 40: Impedir autenticação por senha, permitir somente chave SSH
# ==============================================================================

# Desabilitar completamente autenticação por senha
PasswordAuthentication no

# Desabilitar autenticação vazia ou por desafio interativo
PermitEmptyPasswords no
KbdInteractiveAuthentication no

# Permitir login de root apenas por chave pública (ou bloquear root)
PermitRootLogin prohibit-password

# Chaves públicas habilitadas
PubkeyAuthentication yes

# Limitar tentativas máximas de autenticação por conexão
MaxAuthTries 3

# Tempo limite para completar o login
LoginGraceTime 30
