services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure_web_app
    restart: unless-stopped
    # REQUISITO CRÍTICO DE SEGURANÇA (Requisitos 6 e 31):
    # A porta 8080 é publicada ESTRITAMENTE em 127.0.0.1 (Loopback).
    # NUNCA utilizar "8080:80", pois exporia o contêiner diretamente para a Internet.
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - APP_NAME=Secure Web Application
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=null
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_DECAY_MINUTES=${LOGIN_DECAY_MINUTES:-1}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
